<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover + safe-area：刘海和底部横条不能盖住建造栏；
     user-scalable=no：双指是给地图缩放用的，不是给页面放大用的 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>红警前线 · 手机网页战术游戏</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand"><span class="dot"></span>红警塔防<span class="ver">v0.2</span></div>

    <div class="stats">
      <div class="stat"><i>资金</i><b id="s-money">0</b></div>
      <div class="stat" id="stat-power-box"><i>电力</i><b id="s-power">0/0</b></div>
      <div class="stat"><i id="s-wave-label">波次</i><b id="s-wave">0/0</b></div>
      <div class="stat"><i>基地</i><b id="s-base">100%</b></div>
    </div>

    <div class="actions">
      <button id="btn-mute" class="btn" title="开关声音">音效</button>
      <button id="btn-pause" class="btn" title="空格键也可以暂停">暂停</button>
      <button id="btn-speed" class="btn" title="切换 1 倍 / 2 倍速">1×</button>
      <button id="btn-restart" class="btn" title="重新开始">重开</button>
      <button id="btn-title" class="btn" title="返回标题选择战斗类型">标题</button>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="game" width="1080" height="720"></canvas>

      <!-- 指挥快捷键：手机上没有右键和 Esc，这些是它们替代品 -->
      <div id="cmd-bar" class="cmd-bar">
        <button id="cmd-cancel" class="cmd" title="取消当前选择（Esc / 右键）">取消</button>
        <button id="cmd-same" class="cmd" title="把同型号的单位全收进指挥">同类</button>
        <button id="cmd-home" class="cmd" title="镜头回到基地">回基地</button>
        <button id="cmd-sell" class="cmd" title="点己方建筑拆除，返还一半造价">拆除</button>
      </div>

      <div id="toast" class="toast"></div>
      <div id="gameover" class="gameover hidden">
        <div class="go-title">基地失守</div>
        <div class="go-sub" id="go-sub">撑到了第 1 波</div>
        <button class="btn btn-primary" id="btn-again">再来一次</button>
        <button class="btn" id="btn-go-title">返回标题</button>
      </div>
    </div>

    <aside id="sidebar">
      <div class="side-head">
        <label class="map-picker" title="切换地图会重新开始本局">地图
          <select id="map-select" aria-label="选择地图"></select>
        </label>
        <span class="side-power" id="side-power">电力充足</span>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <section id="queue" class="queue" aria-label="生产队列"></section>
      <div id="shop" class="shop"></div>
      <div class="side-foot" id="side-hint">
        选中一项后，点击地图上的空地放置。
        <br>右键 / Esc 取消选择，右键再点己方单位拆除。
      </div>
    </aside>
  </main>

</div>

<div id="title-screen" class="title-screen hidden">
  <div class="title-grid"></div>
  <div class="title-panel">
    <div class="title-kicker">COMMAND &amp; CONQUER · WEB DEFENSE</div>
    <h1>红警前线</h1>
    <p class="title-lead">建造防线，指挥部队，守住每一格阵地。</p>
    <div id="title-modes" class="title-modes" role="group" aria-label="选择战斗类型"></div>
    <div class="title-setup">
      <label for="title-map">作战地图
        <select id="title-map" aria-label="标题页选择地图"></select>
      </label>
      <p id="title-map-desc"></p>
    </div>
    <button id="btn-start" class="btn btn-primary title-start">开始战斗</button>
    <div class="title-help">单指平移 · 双指缩放 · 轻点选择 / 放置<br>遭遇战：选中 MCV 后轻点空地展开基地</div>
  </div>
</div>

<script src="js/core/config.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/terrain.js"></script>
<script src="js/data/maps.js"></script>
<script src="js/core/map.js"></script>
<script src="js/core/view.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/data/damage.js"></script>
<script src="js/data/units.js"></script>
<script src="js/data/waves.js"></script>
<script src="js/core/field.js"></script>
<script src="js/core/battle.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/economy.js"></script>
<script src="js/game/wave.js"></script>
<script src="js/game/ai.js"></script>
<script src="js/render/pixel.js"></script>
<script src="js/render/scene.js"></script>
<script src="js/render/hud.js"></script>
<script src="js/render/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
